# ARGUS local stack.
# The reference implementation is zero-dependency (in-process graph/vector/stream
# engines); the commented services show the production topology drop-ins.
services:
  argus:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"

  # postgres:        # tenant metadata, cases, policies, audit
